<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
<title id="title">Image and text feature skeleton layout</title>
<desc id="desc">Recommended desktop arrangement and mobile stacking order. Dashed blocks are optional.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.heading{font-size:24px;font-weight:700}.sub{font-size:17px;font-weight:700}.block{font-size:14px;font-weight:600}.mobile{font-size:13px;font-weight:600}.num{font-size:12px;font-weight:700;fill:#fff}.key{font-size:13px}
</style>
<rect width="1160" height="650" fill="#fff"/>
<text x="30" y="42" class="heading">Image and text feature</text>
<text x="55" y="82" class="sub">Desktop</text><text x="835" y="82" class="sub">Mobile stacking order</text>
<rect x="30" y="94" width="700" height="470" rx="10" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="810" y="94" width="305" height="470" rx="18" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="55" y="112" width="318" height="270" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="214" y="247" text-anchor="middle" dominant-baseline="middle" class="block">1–3  Heading, body copy + action</text><rect x="387" y="112" width="318" height="270" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="546" y="247" text-anchor="middle" dominant-baseline="middle" class="block">4  Purposeful image + caption</text><rect x="835" y="112" width="255" height="93" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="132" r="13" fill="#315b7d"/><text x="855" y="132" text-anchor="middle" dominant-baseline="middle" class="num">1</text><text x="877" y="158.5" dominant-baseline="middle" class="mobile">Heading</text><rect x="835" y="217" width="255" height="93" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="237" r="13" fill="#315b7d"/><text x="855" y="237" text-anchor="middle" dominant-baseline="middle" class="num">2</text><text x="877" y="263.5" dominant-baseline="middle" class="mobile">Body copy</text><rect x="835" y="322" width="255" height="93" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="342" r="13" fill="#315b7d"/><text x="855" y="342" text-anchor="middle" dominant-baseline="middle" class="num">3</text><text x="877" y="368.5" dominant-baseline="middle" class="mobile">Action</text><rect x="835" y="427" width="255" height="93" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="447" r="13" fill="#315b7d"/><text x="855" y="447" text-anchor="middle" dominant-baseline="middle" class="num">4</text><text x="877" y="473.5" dominant-baseline="middle" class="mobile">Image + caption</text>
<rect x="55" y="590" width="28" height="18" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="93" y="603" class="key">Normally included</text>
<rect x="230" y="590" width="28" height="18" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="6 4"/><text x="268" y="603" class="key">Optional</text>
<text x="1090" y="603" text-anchor="end" class="key">A reusable section, not a complete page.</text>
</svg>