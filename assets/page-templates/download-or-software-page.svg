<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">Download or software page skeleton layout</title>
<desc id="desc">Recommended desktop arrangement and mobile stacking order. Dashed blocks are optional.</desc>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.heading{font-size:24px;font-weight:700}.sub{font-size:17px;font-weight:700}.block{font-size:14px;font-weight:600}.mobile{font-size:13px;font-weight:600}.num{font-size:12px;font-weight:700;fill:#fff}.key{font-size:13px}
</style>
<rect width="1160" height="720" fill="#ffffff"/>
<text x="30" y="42" class="heading">Download or software page</text>
<text x="55" y="78" class="sub">Desktop</text><text x="835" y="78" class="sub">Mobile stacking order</text>
<rect x="30" y="88" width="700" height="560" rx="10" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="810" y="88" width="305" height="560" rx="18" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="55" y="105" width="650" height="82" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380" y="146" text-anchor="middle" dominant-baseline="middle" class="block">1–2  Product name + what it does</text><rect x="55" y="207" width="318" height="112" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="214" y="263" text-anchor="middle" dominant-baseline="middle" class="block">3  Current download option</text><rect x="387" y="207" width="318" height="112" rx="6" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="8 6"/><text x="546" y="263" text-anchor="middle" dominant-baseline="middle" class="block">3  Alternative download option</text><rect x="55" y="339" width="650" height="72" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380" y="375" text-anchor="middle" dominant-baseline="middle" class="block">5  Licence / attribution / citation</text><rect x="55" y="431" width="430" height="105" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="270" y="483.5" text-anchor="middle" dominant-baseline="middle" class="block">4  Requirements + installation</text><rect x="505" y="431" width="200" height="105" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="605" y="483.5" text-anchor="middle" dominant-baseline="middle" class="block">7  Documentation + support</text><rect x="55" y="556" width="650" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380" y="585" text-anchor="middle" dominant-baseline="middle" class="block">6  Version + release details</text><rect x="835" y="105" width="255" height="70" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="125" r="13" fill="#315b7d"/><text x="855" y="125" text-anchor="middle" dominant-baseline="middle" class="num">1</text><text x="877" y="140" dominant-baseline="middle" class="mobile">Product name + explanation</text><rect x="835" y="187" width="255" height="70" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="207" r="13" fill="#315b7d"/><text x="855" y="207" text-anchor="middle" dominant-baseline="middle" class="num">2</text><text x="877" y="222" dominant-baseline="middle" class="mobile">Current download options</text><rect x="835" y="269" width="255" height="70" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="289" r="13" fill="#315b7d"/><text x="855" y="289" text-anchor="middle" dominant-baseline="middle" class="num">3</text><text x="877" y="304" dominant-baseline="middle" class="mobile">Licence / citation conditions</text><rect x="835" y="351" width="255" height="70" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="371" r="13" fill="#315b7d"/><text x="855" y="371" text-anchor="middle" dominant-baseline="middle" class="num">4</text><text x="877" y="386" dominant-baseline="middle" class="mobile">Requirements + installation</text><rect x="835" y="433" width="255" height="70" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="453" r="13" fill="#315b7d"/><text x="855" y="453" text-anchor="middle" dominant-baseline="middle" class="num">5</text><text x="877" y="468" dominant-baseline="middle" class="mobile">Documentation + support</text><rect x="835" y="515" width="255" height="70" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="535" r="13" fill="#315b7d"/><text x="855" y="535" text-anchor="middle" dominant-baseline="middle" class="num">6</text><text x="877" y="550" dominant-baseline="middle" class="mobile">Release details</text>
<rect x="55" y="670" width="28" height="18" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="93" y="683" class="key">Normally included</text>
<rect x="230" y="670" width="28" height="18" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="6 4"/><text x="268" y="683" class="key">Optional</text>
<text x="1090" y="683" text-anchor="end" class="key">Structure is a starting point, not a fixed page length.</text>
</svg>