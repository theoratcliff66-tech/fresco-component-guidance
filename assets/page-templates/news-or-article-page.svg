<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">News or article page skeleton layout</title>
<desc id="desc">Recommended desktop arrangement and mobile stacking order. Dashed blocks are optional.</desc>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.heading{font-size:24px;font-weight:700}.sub{font-size:17px;font-weight:700}.block{font-size:14px;font-weight:600}.mobile{font-size:13px;font-weight:600}.num{font-size:12px;font-weight:700;fill:#fff}.key{font-size:13px}
</style>
<rect width="1160" height="720" fill="#ffffff"/>
<text x="30" y="42" class="heading">News or article page</text>
<text x="55" y="78" class="sub">Desktop</text><text x="835" y="78" class="sub">Mobile stacking order</text>
<rect x="30" y="88" width="700" height="560" rx="10" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="810" y="88" width="305" height="560" rx="18" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="55" y="105" width="650" height="112" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380" y="161" text-anchor="middle" dominant-baseline="middle" class="block">1–4  Eyebrow, headline, standfirst + metadata</text><rect x="55" y="237" width="650" height="140" rx="6" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="8 6"/><text x="380" y="307" text-anchor="middle" dominant-baseline="middle" class="block">5  Lead image + caption / credit</text><rect x="55" y="397" width="430" height="170" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="270" y="482" text-anchor="middle" dominant-baseline="middle" class="block">6  Article body</text><rect x="505" y="397" width="200" height="105" rx="6" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="8 6"/><text x="605" y="449.5" text-anchor="middle" dominant-baseline="middle" class="block">7  Related content</text><rect x="835" y="105" width="255" height="111" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="125" r="13" fill="#315b7d"/><text x="855" y="125" text-anchor="middle" dominant-baseline="middle" class="num">1</text><text x="877" y="160.5" dominant-baseline="middle" class="mobile">Headline package</text><rect x="835" y="228" width="255" height="111" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="248" r="13" fill="#315b7d"/><text x="855" y="248" text-anchor="middle" dominant-baseline="middle" class="num">2</text><text x="877" y="283.5" dominant-baseline="middle" class="mobile">Lead image</text><rect x="835" y="351" width="255" height="111" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="371" r="13" fill="#315b7d"/><text x="855" y="371" text-anchor="middle" dominant-baseline="middle" class="num">3</text><text x="877" y="406.5" dominant-baseline="middle" class="mobile">Article body</text><rect x="835" y="474" width="255" height="111" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="494" r="13" fill="#315b7d"/><text x="855" y="494" text-anchor="middle" dominant-baseline="middle" class="num">4</text><text x="877" y="529.5" dominant-baseline="middle" class="mobile">Related content</text>
<rect x="55" y="670" width="28" height="18" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="93" y="683" class="key">Normally included</text>
<rect x="230" y="670" width="28" height="18" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="6 4"/><text x="268" y="683" class="key">Optional</text>
<text x="1090" y="683" text-anchor="end" class="key">Structure is a starting point, not a fixed page length.</text>
</svg>