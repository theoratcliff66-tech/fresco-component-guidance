<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">Contact page skeleton layout</title>
<desc id="desc">Recommended desktop arrangement and mobile stacking order. Dashed blocks are optional.</desc>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.heading{font-size:24px;font-weight:700}.sub{font-size:17px;font-weight:700}.block{font-size:14px;font-weight:600}.mobile{font-size:13px;font-weight:600}.num{font-size:12px;font-weight:700;fill:#fff}.key{font-size:13px}
</style>
<rect width="1160" height="720" fill="#ffffff"/>
<text x="30" y="42" class="heading">Contact page</text>
<text x="55" y="78" class="sub">Desktop</text><text x="835" y="78" class="sub">Mobile stacking order</text>
<rect x="30" y="88" width="700" height="560" rx="10" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="810" y="88" width="305" height="560" rx="18" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="55" y="105" width="650" height="72" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380" y="141" text-anchor="middle" dominant-baseline="middle" class="block">1  Page heading + scope</text><rect x="55" y="197" width="205" height="115" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="157.5" y="254.5" text-anchor="middle" dominant-baseline="middle" class="block">2  Contact route by need</text><rect x="278" y="197" width="205" height="115" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380.5" y="254.5" text-anchor="middle" dominant-baseline="middle" class="block">2  Contact route by need</text><rect x="500" y="197" width="205" height="115" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="602.5" y="254.5" text-anchor="middle" dominant-baseline="middle" class="block">2  Contact route by need</text><rect x="55" y="332" width="318" height="120" rx="6" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="8 6"/><text x="214" y="392" text-anchor="middle" dominant-baseline="middle" class="block">3  Address, hours + expectations</text><rect x="387" y="332" width="318" height="120" rx="6" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="8 6"/><text x="546" y="392" text-anchor="middle" dominant-baseline="middle" class="block">4  Map / accessible directions</text><rect x="55" y="472" width="650" height="68" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380" y="506" text-anchor="middle" dominant-baseline="middle" class="block">5  Alternative / unresolved enquiries</text><rect x="835" y="105" width="255" height="86" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="125" r="13" fill="#315b7d"/><text x="855" y="125" text-anchor="middle" dominant-baseline="middle" class="num">1</text><text x="877" y="148" dominant-baseline="middle" class="mobile">Page heading + scope</text><rect x="835" y="203" width="255" height="86" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="223" r="13" fill="#315b7d"/><text x="855" y="223" text-anchor="middle" dominant-baseline="middle" class="num">2</text><text x="877" y="246" dominant-baseline="middle" class="mobile">Contact routes by need</text><rect x="835" y="301" width="255" height="86" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="321" r="13" fill="#315b7d"/><text x="855" y="321" text-anchor="middle" dominant-baseline="middle" class="num">3</text><text x="877" y="344" dominant-baseline="middle" class="mobile">Address + expectations</text><rect x="835" y="399" width="255" height="86" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="419" r="13" fill="#315b7d"/><text x="855" y="419" text-anchor="middle" dominant-baseline="middle" class="num">4</text><text x="877" y="442" dominant-baseline="middle" class="mobile">Directions</text><rect x="835" y="497" width="255" height="86" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="517" r="13" fill="#315b7d"/><text x="855" y="517" text-anchor="middle" dominant-baseline="middle" class="num">5</text><text x="877" y="540" dominant-baseline="middle" class="mobile">Alternative enquiry route</text>
<rect x="55" y="670" width="28" height="18" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="93" y="683" class="key">Normally included</text>
<rect x="230" y="670" width="28" height="18" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="6 4"/><text x="268" y="683" class="key">Optional</text>
<text x="1090" y="683" text-anchor="end" class="key">Structure is a starting point, not a fixed page length.</text>
</svg>