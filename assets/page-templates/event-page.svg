<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
<title id="title">Event page skeleton layout</title>
<desc id="desc">Recommended desktop arrangement and mobile stacking order. Dashed blocks are optional.</desc>
<style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#17324d}.heading{font-size:24px;font-weight:700}.sub{font-size:17px;font-weight:700}.block{font-size:14px;font-weight:600}.mobile{font-size:13px;font-weight:600}.num{font-size:12px;font-weight:700;fill:#fff}.key{font-size:13px}
</style>
<rect width="1160" height="720" fill="#ffffff"/>
<text x="30" y="42" class="heading">Event page</text>
<text x="55" y="78" class="sub">Desktop</text><text x="835" y="78" class="sub">Mobile stacking order</text>
<rect x="30" y="88" width="700" height="560" rx="10" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="810" y="88" width="305" height="560" rx="18" fill="#fafafa" stroke="#aab7c2" stroke-width="2"/>
<rect x="55" y="105" width="650" height="82" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="380" y="146" text-anchor="middle" dominant-baseline="middle" class="block">1  Event title + summary</text><rect x="55" y="207" width="430" height="170" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="270" y="292" text-anchor="middle" dominant-baseline="middle" class="block">4  Description + audience</text><rect x="505" y="207" width="200" height="95" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="605" y="254.5" text-anchor="middle" dominant-baseline="middle" class="block">2  Date, time, place + format</text><rect x="505" y="322" width="200" height="55" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="605" y="349.5" text-anchor="middle" dominant-baseline="middle" class="block">3  Booking status + action</text><rect x="55" y="397" width="430" height="88" rx="6" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="8 6"/><text x="270" y="441" text-anchor="middle" dominant-baseline="middle" class="block">5  Speakers / contributors</text><rect x="55" y="505" width="430" height="72" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="270" y="541" text-anchor="middle" dominant-baseline="middle" class="block">6  Accessibility + practical information</text><rect x="505" y="397" width="200" height="72" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="605" y="433" text-anchor="middle" dominant-baseline="middle" class="block">7  Contact</text><rect x="835" y="105" width="255" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="125" r="13" fill="#315b7d"/><text x="855" y="125" text-anchor="middle" dominant-baseline="middle" class="num">1</text><text x="877" y="134" dominant-baseline="middle" class="mobile">Event title + summary</text><rect x="835" y="175" width="255" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="195" r="13" fill="#315b7d"/><text x="855" y="195" text-anchor="middle" dominant-baseline="middle" class="num">2</text><text x="877" y="204" dominant-baseline="middle" class="mobile">Date, time, place + format</text><rect x="835" y="245" width="255" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="265" r="13" fill="#315b7d"/><text x="855" y="265" text-anchor="middle" dominant-baseline="middle" class="num">3</text><text x="877" y="274" dominant-baseline="middle" class="mobile">Booking action</text><rect x="835" y="315" width="255" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="335" r="13" fill="#315b7d"/><text x="855" y="335" text-anchor="middle" dominant-baseline="middle" class="num">4</text><text x="877" y="344" dominant-baseline="middle" class="mobile">Description + audience</text><rect x="835" y="385" width="255" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="405" r="13" fill="#315b7d"/><text x="855" y="405" text-anchor="middle" dominant-baseline="middle" class="num">5</text><text x="877" y="414" dominant-baseline="middle" class="mobile">Speakers</text><rect x="835" y="455" width="255" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="475" r="13" fill="#315b7d"/><text x="855" y="475" text-anchor="middle" dominant-baseline="middle" class="num">6</text><text x="877" y="484" dominant-baseline="middle" class="mobile">Practical information</text><rect x="835" y="525" width="255" height="58" rx="6" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><circle cx="855" cy="545" r="13" fill="#315b7d"/><text x="855" y="545" text-anchor="middle" dominant-baseline="middle" class="num">7</text><text x="877" y="554" dominant-baseline="middle" class="mobile">Contact</text>
<rect x="55" y="670" width="28" height="18" fill="#e8f0f7" stroke="#315b7d" stroke-width="2"/><text x="93" y="683" class="key">Normally included</text>
<rect x="230" y="670" width="28" height="18" fill="#f7f7f7" stroke="#315b7d" stroke-width="2" stroke-dasharray="6 4"/><text x="268" y="683" class="key">Optional</text>
<text x="1090" y="683" text-anchor="end" class="key">Structure is a starting point, not a fixed page length.</text>
</svg>